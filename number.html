<style>

<script>
const vipNumbers = [

];

// Display each category with numbers

  document.write(`<h3>${cat}</h3>`); // Subheader

    document.write(`<div class="card">
      <div class="number">${vip.number}</div>
      <div class="price">${vip.price}</div>
      <div class="call-whatsapp">

}
